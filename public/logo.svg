<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060B18" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#D97706" stroke-width="8" />
  
  <!-- Subtle Glow -->
  <circle cx="256" cy="220" r="140" fill="#F59E0B" opacity="0.08" />

  <!-- Scales of Justice (Mizan al-Adala) -->
  <!-- Center Pillar -->
  <rect x="248" y="100" width="16" height="260" rx="8" fill="url(#goldGrad)" />
  <circle cx="256" cy="90" r="18" fill="url(#goldGrad)" />
  
  <!-- Base Pedestal -->
  <rect x="160" y="360" width="192" height="24" rx="12" fill="url(#goldGrad)" />
  <rect x="190" y="340" width="132" height="20" rx="8" fill="url(#goldGrad)" />
  
  <!-- Horizontal Balance Beam -->
  <rect x="110" y="140" width="292" height="14" rx="7" fill="url(#goldGrad)" />
  <circle cx="110" cy="147" r="10" fill="url(#goldGrad)" />
  <circle cx="402" cy="147" r="10" fill="url(#goldGrad)" />
  
  <!-- Left Scale Pan & Strings -->
  <line x1="110" y1="147" x2="60" y2="230" stroke="#FBBF24" stroke-width="4" />
  <line x1="110" y1="147" x2="160" y2="230" stroke="#FBBF24" stroke-width="4" />
  <path d="M50 230 Q110 270 170 230 Z" fill="url(#goldGrad)" />

  <!-- Right Scale Pan & Strings -->
  <line x1="402" y1="147" x2="352" y2="230" stroke="#FBBF24" stroke-width="4" />
  <line x1="402" y1="147" x2="452" y2="230" stroke="#FBBF24" stroke-width="4" />
  <path d="M342 230 Q402 270 462 230 Z" fill="url(#goldGrad)" />

  <!-- Emblem Text (الدستور) in stylized geometry -->
  <text x="256" y="430" text-anchor="middle" fill="#FDE68A" font-family="Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="2">منصة الدستور</text>
</svg>
